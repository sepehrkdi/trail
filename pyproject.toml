[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trail"
version = "0.1.0"
description = "TRAIL: a unified, reproducible evaluation library for machine unlearning"
authors = [
    { name = "Sepehr Khodadadi Hosseinabadi" },
    { name = "Ekaterina Iakovleva" },
    { name = "Enzo Tartaglione" },
    { name = "Vito Paolo Pastore" },
]
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
keywords = ["machine unlearning", "evaluation", "benchmark", "membership inference", "reproducibility"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch>=2.0",
    "torchvision>=0.15",
    "numpy",
    "scipy",
    "pydantic>=2.5",
    "omegaconf>=2.3",
    "scikit-learn",
    "torchmetrics>=1.0",
    "pyyaml",
]

[project.urls]
Homepage = "https://github.com/sepehrkdi/trail"
Repository = "https://github.com/sepehrkdi/trail"

[project.optional-dependencies]
tracking = ["wandb"]
h5 = ["h5py"]            # optional: SplitBundle.from_h5 input path
plots = ["matplotlib", "scikit-learn"]   # optional: t-SNE coordinate/plot artifacts

[project.scripts]
trail = "trail.cli:main"

[tool.setuptools.packages.find]
include = ["trail*"]

[tool.setuptools.package-data]
trail = ["fixtures/*.csv", "fixtures/*.md", "fixtures/splits/*.json", "fixtures/*.npz", "fixtures/*.json"]
